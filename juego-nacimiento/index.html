<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El nacimiento de Cristo · Juego bíblico</title>
<style>
:root{--ink:#2b1d0e;--paper:#f6eedb;--gold:#b8862b;--card:#fffaf0}
*{box-sizing:border-box}
body{margin:0;font-family:Georgia,serif;background:#e9dfc6;color:var(--ink);min-height:100vh}
header{background:#2b1d0e;color:#f6eedb;padding:14px 18px;display:flex;align-items:center;gap:14px}
header .marca{font:700 14px Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#e7c46b}
header img{height:46px}
main{max-width:720px;margin:0 auto;padding:18px}
h1{font-size:24px;margin:8px 0}
.card{background:var(--card);border:2px solid var(--gold);border-radius:14px;padding:16px;margin:14px 0}
button{font:16px Arial,sans-serif;padding:12px 16px;border-radius:10px;border:2px solid var(--ink);background:#fff;cursor:pointer;margin:4px;min-height:44px}
button.primary{background:var(--ink);color:#f6eedb}
button.ok{background:#d9efd0}
button.mal{background:#f3d2c9}
.opciones button{display:block;width:100%;text-align:left}
.ref{font:700 13px Arial,sans-serif;color:var(--gold);letter-spacing:.06em;text-transform:uppercase}
.pasaje{font-style:italic}
.pie{font:13px Arial,sans-serif;color:#5b4a2e;margin-top:20px}
input{font:18px Georgia,serif;padding:10px;width:100%;border:2px solid var(--ink);border-radius:8px}
.hidden{display:none}
</style>
</head>
<body>
<header>
  <!-- Logo del Templo Bíblico Emanuel: colocar el archivo como logo/templo-biblico-emanuel.png -->
  <img src="logo/templo-biblico-emanuel.png" alt="Templo Bíblico Emanuel" onerror="this.remove()">
  <div class="marca">Templo Bíblico Emanuel · Juego bíblico</div>
</header>
<main>
  <div id="inicio">
    <h1>El nacimiento de Jesucristo en la Escritura</h1>
    <p>Elige tu grupo de edad. Los textos son de la Reina-Valera 1960.</p>
    <div class="card">
      <button class="primary" onclick="elegirGrupo('ninos')">Niños (6 a 11 años)</button>
      <button class="primary" onclick="elegirGrupo('jovenes-adultos')">Jóvenes y adultos</button>
    </div>
  </div>

  <div id="niveles" class="hidden"></div>
  <div id="juego" class="hidden"></div>

  <p class="pie">Las distancias son en línea recta y aproximadas. Las citas se verifican con la Reina-Valera 1960.</p>
</main>
<script src="niveles/datos.js"></script>
<script>
let grupo=null, nivel=null, idx=0, puntos=0, total=0;
const $=id=>document.getElementById(id);
function mostrar(id){['inicio','niveles','juego'].forEach(x=>$(x).classList.toggle('hidden',x!==id));}
function elegirGrupo(g){grupo=g;const d=NIVELES[g];
  $('niveles').innerHTML=`<h1>${d.titulo}</h1><p class="pasaje">${d.bloque}</p>`+
    d.niveles.map((n,i)=>`<div class="card"><div class="ref">Nivel ${i+1}</div><h2 style="margin:4px 0">${n.titulo}</h2><div class="pasaje">${n.pasajes.join(' · ')}</div><button class="primary" onclick="empezar(${i})">Jugar</button></div>`).join('')+
    `<button onclick="mostrar('inicio')">← Volver</button>`;
  mostrar('niveles');}
function empezar(i){nivel=NIVELES[grupo].niveles[i];idx=0;puntos=0;total=0;mostrarPregunta();}
function mostrarPregunta(){
  if(idx>=nivel.preguntas.length){return terminar();}
  const q=nivel.preguntas[idx];
  let html=`<div class="card"><div class="ref">${nivel.titulo} · ${idx+1}/${nivel.preguntas.length}</div><p><b>${q.pregunta}</b></p><div class="opciones" id="op"></div><div id="fb"></div></div>`;
  $('juego').innerHTML=html;mostrar('juego');
  const op=$('op');
  if(q.tipo==='opcion'||q.tipo==='distancia'){
    q.opciones.forEach((o,k)=>{const b=document.createElement('button');b.textContent=o;b.onclick=()=>responder(k===q.respuesta,q.explicacion||'',q.cita,b,k,q.respuesta);op.appendChild(b);});
  } else if(q.tipo==='ordenar'){
    let elegidos=[];const pool=[...q.eventos].sort(()=>Math.random()-.5);
    const sel=document.createElement('p');op.appendChild(sel);
    pool.forEach(e=>{const b=document.createElement('button');b.textContent=e;b.onclick=()=>{elegidos.push(e);b.disabled=true;sel.textContent=elegidos.join(' → ');
      if(elegidos.length===q.eventos.length){const ok=JSON.stringify(elegidos)===JSON.stringify(q.orden_correcto);responder(ok,'Orden correcto: '+q.orden_correcto.join(' → '),q.cita);}};op.appendChild(b);});
  } else if(q.tipo==='completar'){
    const inp=document.createElement('input');inp.placeholder='Escribe la palabra';op.appendChild(inp);
    const b=document.createElement('button');b.className='primary';b.textContent='Comprobar';
    b.onclick=()=>{const ok=inp.value.trim().toLowerCase()===q.respuesta.toLowerCase();responder(ok,'Respuesta: '+q.respuesta,q.cita);};op.appendChild(b);
  }
}
function responder(ok,expl,cita,btn,k,r){
  total++;if(ok)puntos++;
  if(btn){[...btn.parentNode.querySelectorAll('button')].forEach((b,j)=>{b.disabled=true;if(j===r)b.classList.add('ok');else if(j===k&&!ok)b.classList.add('mal');});}
  $('fb').innerHTML=`<p><b>${ok?'¡Correcto!':'Revisa el texto.'}</b> ${expl}</p><p class="ref">Cita: ${cita}</p><button class="primary" onclick="siguiente()">Siguiente</button>`;
}
function siguiente(){idx++;mostrarPregunta();}
function terminar(){
  $('juego').innerHTML=`<div class="card"><div class="ref">Nivel completado</div><h2>${puntos} de ${total} correctas</h2><p class="pasaje">Aplicación: ${nivel.aplicacion}</p><button class="primary" onclick="empezar(${NIVELES[grupo].niveles.indexOf(nivel)})">Repetir nivel</button><button onclick="elegirGrupo(grupo)">Otros niveles</button></div>`;
}
</script>
</body>
</html>
